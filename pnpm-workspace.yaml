  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  eslint: ^9.39.5
  prettier: ^3.6.2
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: 5.9.3
  typescript-eslint: ^8.70.0
  vitest: ^5.0.1
  zod: ^4.6.5
