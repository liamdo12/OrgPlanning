name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are worth cancelling. A run on the default
  # branch is not: it ends in a deploy, and cancelling that halfway leaves the
  # release in whatever state it had reached.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The database suites assert things only a real Postgres can decide — that
    # an exclusion constraint rejects an overlapping booking, that row-level
    # security denies a role. They skip when TEST_DATABASE_URL is unset, so
    # this service is where that guarantee actually lives.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Includes the domain boundary rules: no framework imports and no reading
      # of global process state inside packages/core and packages/db. Those
      # packages' own tests assert the rules actually fire.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # A reset has to stay fast enough to be part of everyday work.
      - name: Database reset completes promptly
        run: |
          start=$(date +%s)
          pnpm --filter @occasion/db db:reset
          elapsed=$(( $(date +%s) - start ))
          echo "reset took ${elapsed}s"
          if [ "$elapsed" -gt 30 ]; then
            echo "::error::db:reset took ${elapsed}s, budget is 30s"
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # No environment variables are set here on purpose: the build must not
      # require secrets, and a domain service must be testable without them.
      - name: Build
        run: pnpm build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # A syntactically valid configuration for a demo-tier container. These are
      # placeholders, not credentials; no request in these steps reaches a
      # provider, because the container is only asked to boot and serve a page.
      BASE_ENV: >-
        -e AUTH_GOOGLE_ENABLED=false
        -e AUTH_SIGNUP_OPEN=false
        -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/postgres
        -e SUPABASE_URL=http://127.0.0.1:54321
        -e SUPABASE_ANON_KEY=ci-anon
        -e SUPABASE_SERVICE_ROLE_KEY=ci-service
        -e STRIPE_SECRET_KEY=sk_test_ci
        -e STRIPE_WEBHOOK_SECRET=whsec_ci
        -e RESEND_API_KEY=re_ci
        -e EMAIL_FROM=ci@example.com
        -e EMAIL_WEBHOOK_SECRET=ci-secret-ci-secret
        -e BRAND_NAME=Occasion
        -e APP_URL=http://localhost:3000
        -e JOBS_TICK_SECRET=ci-secret-ci-secret

      # Set per step rather than in BASE_ENV, because each step is testing a
      # different tier. Named here so the check below knows not to look for them.
      #
      # `EMAIL_SANDBOX_RECIPIENT` is on this list for a reason the others are
      # not: it is *required* off production and *refused* on it. A single value
      # in BASE_ENV could only satisfy one of the two steps below, and the step
      # it broke would fail for a reason that has nothing to do with what it is
      # testing.
      PER_STEP_KEYS: APP_TIER ALLOW_CLOCK_OVERRIDE ALLOW_DESTRUCTIVE_SEED EMAIL_SANDBOX_RECIPIENT

    steps:
      - uses: actions/checkout@v5

      # `BASE_ENV` is a second copy of `.env.example`'s key set, and has to be:
      # the example ships placeholder values the schema deliberately refuses, so
      # only the values can differ. That makes a missing key the way the two
      # drift — and it is how `AUTH_GOOGLE_ENABLED`, added to the schema and not
      # here, left every container in this job refusing to boot.
      - name: Container configuration covers every declared variable
        run: |
          set -euo pipefail
          missing=0
          for key in $(grep -oE '^[A-Z_][A-Z0-9_]*' .env.example); do
            case " $PER_STEP_KEYS " in *" $key "*) continue ;; esac
            case "$BASE_ENV" in
              *"-e $key="*) ;;
              *)
                echo "::error::.env.example declares $key and the CI container never sets it"
                missing=1
                ;;
            esac
          done
          exit $missing

      - uses: docker/setup-buildx-action@v3

      # Proves the standalone image still builds, which is the portability
      # guarantee behind running this anywhere but the current host.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: occasion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The other half of the contract: a good configuration must actually serve.
      - name: Container serves the app
        run: |
          set -euo pipefail
          docker run -d --name occasion-ci -p 3000:3000 \
            -e APP_TIER=demo \
            -e ALLOW_CLOCK_OVERRIDE=true \
            -e ALLOW_DESTRUCTIVE_SEED=true \
            -e EMAIL_SANDBOX_RECIPIENT=ci@example.com \
            ${{ env.BASE_ENV }} \
            occasion:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "served after ${i}s"
              docker rm -f occasion-ci
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not serve within 30s"
          docker logs occasion-ci || true
          docker rm -f occasion-ci
          exit 1

      # A container that boots with a contradictory configuration must die
      # rather than serve. The timeout matters: without it, a regression here
      # means a container that serves forever and a job killed at timeout-minutes
      # with a message that points at nothing.
      - name: Refuse a production tier that allows the clock override
        run: |
          set -euo pipefail
          status=0
          output=$(timeout 60 docker run --rm \
            -e APP_TIER=production \
            -e ALLOW_CLOCK_OVERRIDE=true \
            -e ALLOW_DESTRUCTIVE_SEED=false \
            ${{ env.BASE_ENV }} \
            occasion:ci 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::container booted with APP_TIER=production and ALLOW_CLOCK_OVERRIDE=true"
            exit 1
          fi
          if [ "$status" -eq 124 ]; then
            echo "::error::container neither exited nor was refused; it hung"
            exit 1
          fi
          # The exit code alone would also be satisfied by docker failing to
          # start the image at all, so assert on the reason.
          echo "$output" | grep -q "ALLOW_CLOCK_OVERRIDE"

      # The same shape as the step above, pointing the other way. A sandbox
      # redirect is a development convenience whose production failure mode is
      # silent: every customer's mail arriving in one inbox, and none of it
      # arriving where it was addressed. Nothing at runtime would show it, so
      # the container has to refuse to boot.
      - name: Refuse a production tier that redirects every recipient
        run: |
          set -euo pipefail
          status=0
          output=$(timeout 60 docker run --rm \
            -e APP_TIER=production \
            -e ALLOW_CLOCK_OVERRIDE=false \
            -e ALLOW_DESTRUCTIVE_SEED=false \
            -e EMAIL_SANDBOX_RECIPIENT=ci@example.com \
            ${{ env.BASE_ENV }} \
            occasion:ci 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::container booted with APP_TIER=production and EMAIL_SANDBOX_RECIPIENT set"
            exit 1
          fi
          if [ "$status" -eq 124 ]; then
            echo "::error::container neither exited nor was refused; it hung"
            exit 1
          fi
          echo "$output" | grep -q "EMAIL_SANDBOX_RECIPIENT"

  deploy:
    name: deploy to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the default branch, only a real push, and only once everything that
    # can fail cheaply already has. A red build must never reach the demo.
    needs: [verify, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # The deployment is a single machine, so two releases must not overlap.
    # Queued rather than cancelled: the later commit is the one that should win,
    # and it should win by being deployed after, not by interrupting.
    concurrency:
      group: deploy-planning-org
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # `--remote-only` builds on Fly's builder rather than this runner, so the
      # image that ships is built the same way whoever deploys it.
      #
      # This does not carry secrets: `fly secrets` already holds them, and the
      # boot gate refuses a machine whose configuration is incomplete. A release
      # that cannot boot fails here rather than reporting success, because
      # `fly.toml` declares a health check — without one Fly creates the machine,
      # watches it restart forever, and calls that a successful deploy.
      - name: fly deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
